name: Release

on:
  pull_request:
    types: [closed]

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.pull_request.head.ref }}
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      github.event.pull_request.merged == true &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.base.ref == github.event.repository.default_branch &&
      startsWith(github.event.pull_request.head.ref, 'releasing/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
    env:
      RELEASE_BRANCH: ${{ github.event.pull_request.head.ref }}
      RELEASE_HEAD: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup-nix
      - name: Download the PR's validated upload
        env:
          GH_TOKEN: ${{ github.token }}
        run: nix develop .#release --no-update-lock-file -c ./scripts/download-release.sh "${RELEASE_BRANCH#releasing/}" "$RELEASE_HEAD"
      - name: Upload crate and create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: nix develop .#release --no-update-lock-file -c ./scripts/publish-release.sh "${RELEASE_BRANCH#releasing/}"
